<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 560" width="220" height="560">
  <!-- 1996年ごろのPHSの仮の絵（シルバー）。ストラップは phs-strap_261120.svg（同じ座標で重ねる） -->
  <defs>
    <linearGradient id="body" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#9aa1a9"/><stop offset=".12" stop-color="#e9ecef"/><stop offset=".35" stop-color="#f7f8f9"/>
      <stop offset=".62" stop-color="#cfd4d9"/><stop offset=".86" stop-color="#e6e9ec"/><stop offset="1" stop-color="#8d949c"/>
    </linearGradient>
    <linearGradient id="face" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b9c0c8"/><stop offset="1" stop-color="#a3abb4"/>
    </linearGradient>
    <linearGradient id="key" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe3e7"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d9ead0"/><stop offset="1" stop-color="#c3d9b8"/>
    </linearGradient>
  </defs>
  <!-- アンテナ（短い） -->
  <rect x="34" y="6" width="22" height="58" rx="10" fill="#b9c0c8" stroke="#7f8790" stroke-width="2"/>
  <rect x="36" y="2" width="18" height="16" rx="8" fill="#5d6670"/>
  <!-- 本体 -->
  <rect x="18" y="46" width="184" height="506" rx="54" fill="url(#body)" stroke="#7f8790" stroke-width="2.5"/>
  <!-- ストラップの穴 -->
  <ellipse cx="186" cy="72" rx="6" ry="8" fill="#5d6670" stroke="#e9ecef" stroke-width="1.5"/>
  <!-- 画面まわりの面 -->
  <rect x="34" y="76" width="152" height="206" rx="34" fill="url(#face)"/>
  <g stroke="#6b737c" stroke-width="3.5" stroke-linecap="round"><path d="M88 98h44"/><path d="M92 108h36"/></g>
  <!-- 液晶 -->
  <rect x="50" y="124" width="120" height="120" rx="10" fill="url(#lcd)" stroke="#7f8f80" stroke-width="2"/>
  <rect x="50" y="124" width="120" height="120" rx="10" fill="none" stroke="#0000001f" stroke-width="6"/>
  <!-- 操作キー -->
  <ellipse cx="110" cy="312" rx="34" ry="17" fill="url(#key)" stroke="#8d949c" stroke-width="2"/>
  <ellipse cx="110" cy="312" rx="12" ry="6" fill="#a3abb4"/>
  <rect x="34" y="300" width="34" height="22" rx="11" fill="url(#key)" stroke="#8d949c" stroke-width="2"/>
  <rect x="152" y="300" width="34" height="22" rx="11" fill="url(#key)" stroke="#8d949c" stroke-width="2"/>
  <circle cx="51" cy="311" r="4" fill="#5fb37a"/><circle cx="169" cy="311" r="4" fill="#d95a4e"/>
  <!-- 数字キー -->
  <g font-family="Noto Sans CJK JP,sans-serif" font-size="17" font-weight="700" fill="#5d6670" text-anchor="middle">
    <g fill="url(#key)" stroke="#8d949c" stroke-width="2">
      <rect x="40" y="348" width="40" height="30" rx="15"/><rect x="90" y="348" width="40" height="30" rx="15"/><rect x="140" y="348" width="40" height="30" rx="15"/>
      <rect x="40" y="388" width="40" height="30" rx="15"/><rect x="90" y="388" width="40" height="30" rx="15"/><rect x="140" y="388" width="40" height="30" rx="15"/>
      <rect x="40" y="428" width="40" height="30" rx="15"/><rect x="90" y="428" width="40" height="30" rx="15"/><rect x="140" y="428" width="40" height="30" rx="15"/>
      <rect x="40" y="468" width="40" height="30" rx="15"/><rect x="90" y="468" width="40" height="30" rx="15"/><rect x="140" y="468" width="40" height="30" rx="15"/>
    </g>
    <text x="60" y="369">1</text><text x="110" y="369">2</text><text x="160" y="369">3</text>
    <text x="60" y="409">4</text><text x="110" y="409">5</text><text x="160" y="409">6</text>
    <text x="60" y="449">7</text><text x="110" y="449">8</text><text x="160" y="449">9</text>
    <text x="60" y="489">＊</text><text x="110" y="489">0</text><text x="160" y="489">＃</text>
  </g>
  <g fill="#8d949c"><circle cx="100" cy="526" r="2.5"/><circle cx="110" cy="526" r="2.5"/><circle cx="120" cy="526" r="2.5"/></g>
  <!-- つや -->
  <path d="M40 92 C38 200 38 380 44 520" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".85"/>
  <path d="M184 120 C186 250 186 400 180 500" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".5"/>
</svg>
