<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原稿用紙UI 試作</title>
<!--
  サイカチADV UI試作：横位置の漫画原稿用紙を台紙にした 1920×1080 の画面（2026-11-10：ハルキを本番イラスト haruki-game_261109 に差し替え）
  ・作者が微調整した配置（manga-ui_261026h.png）を HTML に起こしたもの。位置と大きさは h.png から測った値
  ・決定済み：台紙（オフホワイト・青の原稿用紙 manga-paper_261026g）／ハンコ文字／赤鉛筆の時間の丸／付せんのメニュー
  ・立ち絵は キャラクター/*-rough_261026c（決定したベースのラフ）の白地を抜いた切り抜き char-*-rough_261027.png
  ・背景・人物名は ADV4/assets の既存の仮画像
  ・下のボタンで話し手を切り替え（URL の #haruki でも可）
-->
<style>
@font-face{font-family:'ADV Gothic';src:url('../../ADV4/assets/fonts/NotoSansJP-Regular.subset.woff') format('woff');font-weight:400}
@font-face{font-family:'ADV Gothic';src:url('../../ADV4/assets/fonts/NotoSansJP-Bold.subset.woff') format('woff');font-weight:700 900}
@font-face{font-family:'ADV Mincho';src:url('../../ADV4/assets/fonts/NotoSerifJP-Bold.subset.woff') format('woff');font-weight:400 900}
:root{
  --font-body:'ADV Gothic','Noto Sans CJK JP','Noto Sans JP',sans-serif;
  --font-head:'ADV Mincho','Noto Serif CJK JP','Noto Serif JP',serif;
  --ink:#141414; --white:#fdfcf8; --red:#d0372a; --blue:#5087c4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#111;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;
  font-family:var(--font-body);color:var(--ink);background:#f7f5ee url('manga-paper_261026g.png') 0 0/1920px 1080px no-repeat}
.abs{position:absolute}

/* ===== 1. 上の欄（決定済み） ===== */
.stamp{height:44px;top:4px;z-index:3}
.circle{width:120px;height:52px;top:0;z-index:3}
/* メニューの付せん：130%に拡大し、右上の角に −6度で貼る（付せん本体は x1672〜1900・y15〜102 あたり） */
.menu{left:1630px;top:6px;width:312px;height:94px;transform:rotate(-6deg);transform-origin:50% 50%;cursor:pointer;z-index:20}

/* ===== 2. コマ：中心 (761,432)、1398×718、時計回りに 0.9度。墨 8px。上端は上の定規に少しかかる ===== */
.koma{left:62px;top:73px;width:1398px;height:718px;transform:rotate(.9deg);border:8px solid var(--ink);
  background:#222 url('../背景/ochanomizu-tonecolor_261106.png') center/cover;z-index:2}   /* 背景：背景/ochanomizu-tonecolor_261106.png（2560×1440） */

/* ===== 3. 立ち絵：コマの外。白いふち取りの切り抜きで、コマと会話の紙の手前に重ね、画面の下へはみ出す ===== */
.ch{position:absolute;z-index:12;pointer-events:none;
  filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff)}
/* ラフ 1088×1456 の0.385倍（419×561）。切らずに置き、画面の下端ではみ出す */
.ch.haruki{left:-12px;top:540px;width:426px;height:590px}   /* 左下。本番イラスト 1040×1440 の0.41倍（サイジと同じ倍率）。目の位置をラフに合わせた */
.ch.saiji{left:1521px;top:533px;width:426px;height:590px}    /* 右下。本番イラスト 1040×1440 の0.41倍。目の位置をラフに合わせた */

/* ===== 4. 捜査コマンド：x1487〜。行ごとに位置をずらし、選択中は文字を大きくする ===== */
.lab{font-size:21px;color:var(--blue);letter-spacing:.12em;z-index:5}
.cmd{position:absolute;z-index:5;display:flex;align-items:flex-end;gap:4px}
.cmd b{display:grid;place-items:center;background:var(--white);box-shadow:3px 3px 0 #0000002a;line-height:1}
.s1{font:900 46px/1 var(--font-head);padding:5px 7px}
.s2{font:900 27px/1 var(--font-body);padding:5px;background:var(--ink)!important;color:#fff}
.s3{font:700 31px/1 var(--font-body);padding:4px 5px}
.s4{font:900 36px/1 var(--font-head);padding:5px;background:var(--ink)!important;color:#fff}
/* 選択中（調べる）：前の版の約1.4倍 */
.cmd.on .s1,.cmd.on .s4{font-size:64px;padding:7px 8px}
.cmd.on .s3{font-size:46px;padding:8px 10px}

/* ===== 5. 調べる先：x1730〜1860。紙片ごとに位置と傾きをずらす ===== */
.pl{position:absolute;z-index:5}
.pl b{display:inline-grid;place-items:center;min-width:72px;height:50px;padding:0 13px;font:900 26px/1 var(--font-body);letter-spacing:.08em;
  background:var(--white);box-shadow:4px 5px 0 #00000026}
.check{position:absolute;width:64px;height:56px;pointer-events:none;z-index:7}
.redpen{position:absolute;pointer-events:none;z-index:7}
svg.ov{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:6}

/* ===== 6. 会話ウィンドウ：白い紙2枚（台紙はオフホワイト）。影で重なりを出す ===== */
.sheet{position:absolute;height:340px;background:#ffffff;transform-origin:50% 0}
.sheet.back{left:89px;width:1760px;top:812px;transform:rotate(-2.2deg);box-shadow:0 0 0 1px #0000000f,0 -4px 12px #00000026;z-index:8}
.sheet.front{left:60px;width:1770px;top:847px;transform:rotate(1deg);box-shadow:0 0 0 1px #00000012,0 -6px 14px #00000040,0 -2px 3px #00000026;z-index:9}
/* 人物名と本文：2人の立ち絵のあいだ。紙の傾きとは別に水平に置く */
.name{left:405px;top:852px;width:186px;height:93px;background:center/contain no-repeat;transform:rotate(-3deg);z-index:11}
.name.saiji{background-image:url('../../ADV4/assets/ui/name-saiji.png')}
.name.haruki{background-image:url('../../ADV4/assets/ui/name-haruki.png')}
.line{left:616px;top:869px;width:900px;margin:0;font:700 31px/1.75 var(--font-head);letter-spacing:.06em;transform:rotate(.6deg);transform-origin:0 50%;z-index:11}
/* 送りマーク：本文の終わりのすぐ後ろ */
.next{display:inline-block;width:0;height:0;margin-left:22px;vertical-align:-4px;border:15px solid transparent;border-left:25px solid var(--red);border-right:0}

#stage:not(.saiji) .only-saiji,#stage:not(.haruki) .only-haruki{display:none}
#ctrl{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:100;display:flex;gap:6px;font:14px sans-serif}
#ctrl button{background:#efe5cf;border:2px solid #111;padding:4px 10px;cursor:pointer}
#ctrl button[aria-pressed=true]{background:#d0372a;color:#fff}
.shot #ctrl{display:none}
</style>
</head>
<body>
<div id="stage" class="saiji">

  <!-- 1. 上の欄 -->
  <img class="abs stamp" src="stamp-title_261026.png" style="left:122px" alt="東京意匠學校奇譚 七ツノ怪異">
  <img class="abs stamp" src="stamp-date-0719_261026.png" style="left:790px" alt="7月19日（金）">
  <img class="abs stamp" src="stamp-place-classroom_261026.png" style="left:1080px" alt="美術準備室">
  <img class="abs circle" src="time-circle-houkago_261026.png" style="left:1492px" alt="放課後">
  <img class="abs menu" src="menu-note_261026b.png" alt="メニュー">

  <!-- 2. コマ -->
  <div class="abs koma"></div>

  <!-- 4. 捜査コマンド（長体＝scale(.78,1)、平体＝scale(1.12,.75)） -->
  <div class="abs lab" style="left:1510px;top:108px">捜査</div>
  <div class="cmd" style="left:1510px;top:148px"><b class="s1" style="transform:rotate(-5deg) scale(.78,1)">移</b><b class="s2" style="transform:rotate(4deg) translateY(-6px)">動</b></div>
  <div class="cmd" style="left:1520px;top:225px"><b class="s4" style="transform:rotate(3deg) scale(1.12,.74)">聞</b><b class="s3" style="transform:rotate(-6deg) translateY(4px)">く</b></div>
  <div class="cmd on" style="left:1487px;top:285px"><b class="s4" style="transform:rotate(-3deg) scale(.8,1)">調</b><b class="s3" style="transform:rotate(7deg) scale(1.15,.78) translateY(-8px)">べ</b><b class="s1" style="font-size:52px;transform:rotate(-4deg)">る</b></div>
  <div class="cmd" style="left:1520px;top:380px"><b class="s1" style="transform:rotate(2deg) scale(1.12,.76)">探</b><b class="s2" style="transform:rotate(-5deg) scale(.8,1) translateY(5px)">す</b></div>
  <div class="cmd" style="left:1512px;top:442px"><b class="s1" style="transform:rotate(-6deg)">見</b><b class="s2" style="transform:rotate(3deg) scale(1.15,.75) translateY(-10px)">せ</b><b class="s3" style="transform:rotate(-3deg) scale(.78,1)">る</b></div>
  <div class="cmd" style="left:1530px;top:520px"><b class="s3" style="transform:rotate(5deg) scale(.8,1) translateY(6px)">会</b><b class="s1" style="transform:rotate(-2deg) scale(1.1,.78)">話</b></div>

  <!-- 5. 調べる先 -->
  <div class="abs lab" style="left:1712px;top:140px">調べる先</div>
  <div class="pl" style="left:1745px;top:192px"><b style="transform:rotate(-3deg)">机</b></div>
  <div class="pl" style="left:1755px;top:257px"><b style="transform:rotate(2deg)">作品棚</b></div>
  <div class="pl" style="left:1730px;top:339px"><b style="transform:rotate(4deg)">窓</b></div>
  <div class="pl" style="left:1752px;top:403px"><b style="transform:rotate(-4deg)">ドア</b></div>
  <div class="pl" style="left:1737px;top:474px"><b style="transform:rotate(2deg)">床</b></div>
  <!-- 赤鉛筆：選択中の丸とレ点、青鉛筆の矢印 -->
  <img class="redpen" src="time-circle-asa_261026.png" style="left:1723px;top:176px;width:110px;height:72px" alt="">
  <img class="check" src="check-a_261026.png" style="left:1830px;top:244px" alt="調べた">
  <img class="check" src="check-b_261026.png" style="left:1772px;top:324px" alt="調べた">
  <svg class="ov" viewBox="0 0 1920 1080">
    <path d="M1706 338 C 1716 300, 1708 250, 1726 216" fill="none" stroke="#5087c4" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M1717 226 l10 -12 l4 15" fill="none" stroke="#5087c4" stroke-width="2.5" stroke-linecap="round"/>
  </svg>

  <!-- 6. 会話ウィンドウ -->
  <div class="sheet back"></div>
  <div class="sheet front"></div>
  <div class="abs name saiji only-saiji"></div>
  <div class="abs name haruki only-haruki"></div>
  <p class="abs line only-saiji">作品棚に部員のスケッチブックがしまわれているな。<br>ナカコのはどれだ？<span class="next"></span></p>
  <p class="abs line only-haruki">背表紙に名前が書いてある。<br>……あった、これがナカコのだ。<span class="next"></span></p>

  <!-- 3. 立ち絵（いちばん手前） -->
  <img class="ch haruki" src="char-haruki_261109.png" alt="ハルキ">
  <img class="ch saiji" src="char-saiji_261103.png" alt="サイジ">
</div>

<div id="ctrl">
  <button data-who="saiji" aria-pressed="true">サイジが話す</button>
  <button data-who="haruki">ハルキが話す</button>
</div>
<script>
const st=document.getElementById('stage');
function fit(){st.style.setProperty('--s',Math.min(innerWidth/1920,innerHeight/1080))}
addEventListener('resize',fit);fit();
function who(w){['saiji','haruki'].forEach(c=>st.classList.toggle(c,c===w));
  document.querySelectorAll('[data-who]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.who===w))}
document.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>who(b.dataset.who));
const h=location.hash.slice(1).split(',');
if(h.includes('haruki'))who('haruki');
if(h.includes('shot'))document.body.classList.add('shot');
</script>
</body>
</html>
